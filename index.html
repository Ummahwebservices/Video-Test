<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Rashad Mahmood Reel</title>
<style>
@font-face{font-family:'Inter Tight';font-weight:100 900;src:url(fonts/InterTight.woff2) format('woff2');font-display:block}
@font-face{font-family:'JetBrains Mono';font-weight:100 800;src:url(fonts/JetBrainsMono.woff2) format('woff2');font-display:block}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/InstrumentSerif-Italic.woff2) format('woff2');font-display:block}

:root{
  --ink:#0B0C10; --ink2:#14161D; --paper:#F2EEE5; --mute:#7C7F89;
  --signal:#FF4F1A; --line:rgba(242,238,229,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.mask{position:absolute;overflow:hidden;white-space:nowrap}
.ch{display:inline-block;will-change:transform}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:120px 120px;background-position:0 0}
#grain{position:absolute;inset:-200px;pointer-events:none;mix-blend-mode:overlay;opacity:.11}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.crop{position:absolute;width:28px;height:28px;border-color:var(--paper);border-style:solid;opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="grid"></div>

  <!-- ===== Scene 1: name split by the roadmap line ===== -->
  <div id="s1" style="position:absolute;inset:0">
    <div class="abs" id="dot" style="width:28px;height:28px;border-radius:50%;background:var(--signal);left:946px;top:526px"></div>
    <div class="abs" id="s1line" style="height:4px;background:var(--signal);top:538px;left:160px;width:1600px;transform-origin:50% 50%"></div>
    <div class="mask" id="s1top" style="left:146px;bottom:556px;height:250px;padding:0 20px">
      <span class="split" style="font-size:268px;font-weight:900;letter-spacing:-.055em;line-height:250px;display:block">Rashad</span>
    </div>
    <div class="mask" id="s1bot" style="right:140px;top:546px;height:290px;padding:0 40px 0 20px">
      <span class="split serif" style="font-size:300px;line-height:270px;display:block;letter-spacing:-.02em">Mahmood</span>
    </div>
    <div class="mask mono" id="s1lab1" style="left:162px;top:570px;font-size:24px;color:var(--paper)"><span class="type" data-text="Principal Product Manager"></span></div>
    <div class="mask mono" id="s1lab2" style="right:160px;top:496px;font-size:24px;color:var(--mute);text-align:right"><span class="type" data-text="Opus 2 · London"></span></div>
  </div>

  <!-- ===== Scene 2: slot-machine statement ===== -->
  <div id="s2" style="position:absolute;left:160px;top:250px">
    <div class="mask" style="height:150px;top:0;left:0"><span class="split" style="font-size:140px;font-weight:800;letter-spacing:-.045em;line-height:150px;display:block">Turning</span></div>
    <div class="mask" id="slot" style="height:190px;top:150px;left:-10px;padding:0 30px 0 10px;width:1300px">
      <div id="slotcol" class="serif" style="font-size:190px;line-height:190px;color:var(--signal);letter-spacing:-.02em">
        <div>messy data</div><div>regulation</div><div>legacy APIs</div><div>agentic AI</div><div>ambiguity</div>
      </div>
    </div>
    <div class="abs" id="slotline" style="left:0;top:345px;height:4px;width:780px;background:var(--signal);transform-origin:0 50%"></div>
    <div class="mask" style="height:150px;top:370px;left:0"><span class="split" style="font-size:140px;font-weight:800;letter-spacing:-.045em;line-height:150px;display:block">into shipped product.</span></div>
  </div>

  <!-- ===== Scene 3: impact numbers ===== -->
  <div id="s3" style="position:absolute;inset:0"></div>

  <!-- ===== Scene 4: roadmap timeline ===== -->
  <div id="s4" style="position:absolute;inset:0">
    <div class="mask" id="ghostyear" style="right:110px;top:150px;height:330px;width:1000px;text-align:right">
      <div id="yearcol" style="font-size:330px;line-height:330px;font-weight:900;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px rgba(242,238,229,.16)"></div>
    </div>
    <div id="world" class="abs" style="left:0;top:0;width:5200px;height:1080px">
      <div class="abs" id="tline" style="left:0;top:678px;height:3px;width:5200px;background:rgba(242,238,229,.35);transform-origin:0 50%"></div>
      <div class="abs" id="tprog" style="left:0;top:677px;height:5px;width:5200px;background:var(--signal);transform-origin:0 50%"></div>
    </div>
    <div class="mask mono" id="ticker" style="left:0;bottom:120px;width:1920px;font-size:22px;color:var(--mute)"><div id="tickerin" style="display:inline-block"></div></div>
  </div>

  <!-- ===== Scene 5: end card ===== -->
  <div id="flood" class="abs" style="width:40px;height:40px;border-radius:50%;background:var(--signal);left:0;top:0"></div>
  <div id="s5" style="position:absolute;inset:0;color:var(--ink)">
    <div class="abs" id="s5line" style="height:4px;background:var(--ink);top:538px;left:160px;width:1600px;transform-origin:0 50%"></div>
    <div class="mask" style="left:146px;bottom:556px;height:250px;padding:0 20px">
      <span class="split" style="font-size:268px;font-weight:900;letter-spacing:-.055em;line-height:250px;display:block">Rashad</span>
    </div>
    <div class="mask" style="right:140px;top:546px;height:290px;padding:0 40px 0 20px">
      <span class="split serif" style="font-size:300px;line-height:270px;display:block;letter-spacing:-.02em">Mahmood.</span>
    </div>
    <div class="mask mono" style="left:162px;top:570px;font-size:24px"><span class="type" data-text="Principal Product Manager"></span></div>
    <div class="mask mono" style="right:160px;top:496px;font-size:24px;text-align:right"><span class="type" data-text="Discovery → Delivery"></span></div>
    <div class="abs" id="s5foot" style="left:160px;right:160px;bottom:90px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--ink);padding-top:22px">
      <div class="mask mono" style="position:relative;font-size:22px"><span class="type" data-text="Agentic AI · APIs · MCP"></span></div>
      <div class="mask mono" style="position:relative;font-size:22px"><span class="type" data-text="SAFe PO/PM · London"></span></div>
      <div class="mask mono" style="position:relative;font-size:22px;text-transform:none;letter-spacing:.06em"><span class="type" data-text="rashad.mahmood@outlook.com"></span></div>
    </div>
  </div>

  <!-- ===== Chrome ===== -->
  <div id="chrome" style="position:absolute;inset:0">
    <div class="crop" style="left:60px;top:60px;border-width:2px 0 0 2px"></div>
    <div class="crop" style="right:60px;top:60px;border-width:2px 2px 0 0"></div>
    <div class="crop" style="left:60px;bottom:60px;border-width:0 0 2px 2px"></div>
    <div class="crop" style="right:60px;bottom:60px;border-width:0 2px 2px 0"></div>
    <div class="abs mono" id="mono" style="left:110px;top:66px;font-size:20px;color:var(--paper)">RM<span style="color:var(--signal)">—</span></div>
    <div class="mask mono" id="sect" style="right:110px;top:66px;height:28px;font-size:20px;text-align:right;width:600px">
      <div id="sectcol" style="line-height:28px">
        <div>01 &nbsp;Intro</div><div>02 &nbsp;Approach</div><div>03 &nbsp;Impact</div><div>04 &nbsp;Journey</div>
      </div>
    </div>
    <div class="abs mono" id="tc" style="left:110px;bottom:66px;font-size:20px;color:var(--mute)"></div>
    <div class="abs" style="right:110px;bottom:76px;width:240px;height:2px;background:rgba(242,238,229,.2)"><div id="bar" style="height:100%;background:var(--signal);transform-origin:0 50%"></div></div>
  </div>

  <canvas id="grain" width="512" height="512"></canvas>
  <div id="vignette"></div>
</div>

<script src="reel.js"></script>
</body>
</html>
