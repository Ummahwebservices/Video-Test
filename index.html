<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Rashad Mahmood Reel</title>
<style>
@font-face{font-family:'Inter Tight';font-weight:100 900;src:url(fonts/InterTight.woff2) format('woff2');font-display:block}
@font-face{font-family:'JetBrains Mono';font-weight:100 800;src:url(fonts/JetBrainsMono.woff2) format('woff2');font-display:block}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/InstrumentSerif-Italic.woff2) format('woff2');font-display:block}

:root{
  --ink:#0B0C10; --ink2:#14161D; --paper:#F2EEE5; --mute:#7C7F89;
  --signal:#FF4F1A; --line:rgba(242,238,229,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:'Inter Tight',sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.mask{position:absolute;overflow:hidden;white-space:nowrap}
.ch{display:inline-block;will-change:transform}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:120px 120px;background-position:0 0}
#grain{position:absolute;inset:-200px;pointer-events:none;mix-blend-mode:overlay;opacity:.11}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.crop{position:absolute;width:28px;height:28px;border-color:var(--paper);border-style:solid;opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="grid"></div>

  <!-- ===== Scene 1: name split by the roadmap line ===== -->
  <div id="s1" style="position:absolute;inset:0">
    <div class="abs" id="dot" style="width:28px;height:28px;border-radius:50%;background:var(--signal);left:946px;top:526px"></div>
    <div class="abs" id="s1line" style="height:4px;background:var(--signal);top:538px;left:160px;width:1600px;transform-origin:50% 50%"></div>
    <div class="mask" id="s1top" style="left:146px;bottom:556px;height:250px;padding:0 20px">
      <span class="split" style="font-size:268px;font-weight:900;letter-spacing:-.055em;line-height:250px;display:block">Rashad</span>
    </div>
    <div class="mask" id="s1bot" style="right:140px;top:546px;height:290px;padding:0 40px 0 20px">
      <span class="split serif" style="font-size:300px;line-height:270px;display:block;letter-spacing:-.02em">Mahmood</span>
    </div>
    <div class="mask mono" id="s1lab1" style="left:162px;top:570px;font-size:24px;color:var(--paper)"><span class="type" data-text="Principal Product Manager"></span></div>
    <div class="mask mono" id="s1lab2" style="right:160px;top:496px;font-size:24px;color:var(--mute);text-align:right"><span class="type" data-text="London / Dubai"></span></div>
  </div>

  <!-- ===== Scene 2: slot-machine statement ===== -->
  <div id="s2" style="position:absolute;left:160px;top:250px">
    <div class="mask" style="height:150px;top:0;left:0"><span class="split" style="font-size:140px;font-weight:800;letter-spacing:-.045em;line-height:150px;display:block">Turning</span></div>
    <div class="mask" id="slot" style="height:190px;top:150px;left:-10px;padding:0 30px 0 10px;width:1300px">
      <div id="slotcol" class="serif" style="font-size:190px;line-height:190px;color:var(--signal);letter-spacing:-.02em">
        <div>messy data</div><div>regulation</div><div>big bets</div><div>raw AI</div><div>ambiguity</div>
      </div>
    </div>
    <div class="abs" id="slotline" style="left:0;top:345px;height:4px;width:780px;background:var(--signal);transform-origin:0 50%"></div>
    <div class="mask" style="height:150px;top:370px;left:0"><span class="split" style="font-size:140px;font-weight:800;letter-spacing:-.045em;line-height:150px;display:block">into shipped product.</span></div>
  </div>

  <!-- ===== Scene 3: impact numbers ===== -->
  <div id="s3" style="position:absolute;inset:0"></div>

  <!-- ===== Scene 4: roadmap timeline ===== -->
  <div id="s4" style="position:absolute;inset:0">
    <div class="mask" id="ghostyear" style="right:110px;top:150px;height:330px;width:1000px;text-align:right">
      <div id="yearcol" style="font-size:330px;line-height:330px;font-weight:900;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px rgba(242,238,229,.16)"></div>
    </div>
    <div id="world" class="abs" style="left:0;top:0;width:4400px;height:1080px">
      <div class="abs" id="tline" style="left:0;top:678px;height:3px;width:4400px;background:rgba(242,238,229,.35);transform-origin:0 50%"></div>
      <div class="abs" id="tprog" style="left:0;top:677px;height:5px;width:4400px;background:var(--signal);transform-origin:0 50%"></div>
    </div>
    <div class="mask mono" id="ticker" style="left:0;bottom:120px;width:1920px;font-size:22px;color:var(--mute)"><div id="tickerin" style="display:inline-block"></div></div>
  </div>

  <!-- ===== Scene 5: end card ===== -->
  <div id="flood" class="abs" style="width:40px;height:40px;border-radius:50%;background:var(--signal);left:0;top:0"></div>
  <div id="s5" style="position:absolute;inset:0;color:var(--ink)">
    <div class="abs" id="s5line" style="height:4px;background:var(--ink);top:538px;left:160px;width:1600px;transform-origin:0 50%"></div>
    <div class="mask" style="left:146px;bottom:556px;height:250px;padding:0 20px">
      <span class="split" style="font-size:268px;font-weight:900;letter-spacing:-.055em;line-height:250px;display:block">Rashad</span>
    </div>
    <div class="mask" style="right:140px;top:546px;height:290px;padding:0 40px 0 20px">
      <span class="split serif" style="font-size:300px;line-height:270px;display:block;letter-spacing:-.02em">Mahmood.</span>
    </div>
    <div class="mask mono" style="left:162px;top:570px;font-size:24px"><span class="type" data-text="Principal Product Manager"></span></div>
    <div class="mask mono" style="right:160px;top:496px;font-size:24px;text-align:right"><span class="type" data-text="Discovery → Delivery"></span></div>
    <div class="abs" id="s5foot" style="left:160px;right:160px;bottom:90px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--ink);padding-top:22px">
      <div class="mask mono" style="position:relative;font-size:22px"><span class="type" data-text="Strategy · Data · Delivery"></span></div>
      <div class="mask mono" style="position:relative;font-size:22px"><span class="type" data-text="SAFe PO · London / Dubai"></span></div>
      <div class="mask mono" style="position:relative;font-size:22px;text-transform:none;letter-spacing:.06em"><span class="type" data-text="rashad.mahmood@outlook.com"></span></div>
    </div>
  </div>

  <!-- ===== Chrome ===== -->
  <div id="chrome" style="position:absolute;inset:0">
    <div class="crop" style="left:60px;top:60px;border-width:2px 0 0 2px"></div>
    <div class="crop" style="right:60px;top:60px;border-width:2px 2px 0 0"></div>
    <div class="crop" style="left:60px;bottom:60px;border-width:0 0 2px 2px"></div>
    <div class="crop" style="right:60px;bottom:60px;border-width:0 2px 2px 0"></div>
    <div class="abs mono" id="mono" style="left:110px;top:66px;font-size:20px;color:var(--paper)">RM<span style="color:var(--signal)">—</span></div>
    <div class="mask mono" id="sect" style="right:110px;top:66px;height:28px;font-size:20px;text-align:right;width:600px">
      <div id="sectcol" style="line-height:28px">
        <div>01 &nbsp;Intro</div><div>02 &nbsp;Approach</div><div>03 &nbsp;Impact</div><div>04 &nbsp;Journey</div>
      </div>
    </div>
    <div class="abs mono" id="tc" style="left:110px;bottom:66px;font-size:20px;color:var(--mute)"></div>
    <div class="abs" style="right:110px;bottom:76px;width:240px;height:2px;background:rgba(242,238,229,.2)"><div id="bar" style="height:100%;background:var(--signal);transform-origin:0 50%"></div></div>
  </div>

  <canvas id="grain" width="512" height="512"></canvas>
  <div id="vignette"></div>
</div>

<script>
const W=1920,H=1080,DUR=15;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic:x=>1-Math.pow(1-x,3),
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  inOutQuint:x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2,
  outBack:(x,s=2.2)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),
  inBack:(x,s=1.8)=>(s+1)*x*x*x-s*x*x,
};

/* ---------- build helpers ---------- */
$$('.split').forEach(el=>{
  const txt=el.textContent; el.textContent='';
  [...txt].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;el.appendChild(s)});
});
$$('.type').forEach(el=>{el.textContent=''});
const typeIn=(el,x)=>{const t=el.dataset.text;const n=Math.round(t.length*cl(x));
  el.textContent=t.slice(0,n)+(x>0&&x<1?'▍':'');};
// letters rise: dir=1 from below, -1 from above
function rise(el,t,start,{stagger=.035,dur=.7,dir=1,ease=E.outExpo,out=null,outDur=.45,outDir=-1,outStagger=.02}={}){
  const chs=$$('.ch',el);
  chs.forEach((c,i)=>{
    let y=(1-ease(P(t,start+i*stagger,start+i*stagger+dur)))*dir*105;
    let r=(1-ease(P(t,start+i*stagger,start+i*stagger+dur)))*dir*8;
    if(out!==null){const o=E.inExpo(P(t,out+i*outStagger,out+i*outStagger+outDur));y+=o*outDir*110;}
    c.style.transform=`translateY(${y}%) rotate(${r}deg)`;
  });
}
const show=(el,on)=>{el.style.display=on?'':'none'};

/* ---------- Scene 3 data ---------- */
const stats=[
  {pre:'',val:50,suf:'%',co:'Deutsche Bank',l1:'faster financial',l2:'crime investigations',sub:'115 steps removed'},
  {pre:'+',val:30,suf:'%',co:'Global Relay',l1:'team productivity',l2:'in six months',sub:'auth service reused by 50% of APIs'},
  {pre:'+',val:20,suf:'%',co:'Tesco',l1:'delivery velocity',l2:'on the HR data platform',sub:'value award · coached 3 APMs'},
  {pre:'£',val:200,suf:'K',co:'Virgin Money',l1:'saved, shipped',l2:'two months early',sub:'EMIR reporting transition'},
];
const s3=$('#s3');
stats.forEach((s,i)=>{
  const d=document.createElement('div');d.className='stat';d.style.cssText='position:absolute;inset:0';
  d.innerHTML=`
   <div class="mask" style="left:150px;top:300px;height:400px;padding:0 20px"><div class="num" style="display:inline-block;font-size:400px;line-height:400px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums"></div></div>
   <div class="abs bartrack" style="left:170px;top:740px;width:820px;height:4px;background:rgba(242,238,229,.14)"><div class="barfill" style="height:100%;background:var(--signal);transform-origin:0 50%"></div></div>
   <div class="mask mono kick" style="left:1130px;top:360px;font-size:24px;color:var(--signal)"><span class="type" data-text="0${i+1} — ${s.co}"></span></div>
   <div class="mask" style="left:1120px;top:420px;height:84px;padding:0 10px"><span class="split" style="font-size:72px;line-height:84px;font-weight:700;letter-spacing:-.035em;display:block">${s.l1}</span></div>
   <div class="mask" style="left:1120px;top:504px;height:96px;padding:0 10px"><span class="split serif" style="font-size:84px;line-height:96px;display:block;color:var(--paper)">${s.l2}</span></div>
   <div class="mask mono sub" style="left:1130px;top:650px;font-size:20px;color:var(--mute)"><span class="type" data-text="${s.sub}"></span></div>`;
  s3.appendChild(d);
});
$$('.split',s3).forEach(el=>{const txt=el.textContent;el.textContent='';[...txt].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;el.appendChild(s)})});
$$('.type',s3).forEach(el=>el.textContent='');
// number digits as their own char spans so they can rise
const statEls=$$('.stat');

/* ---------- Scene 4 data ---------- */
const nodes=[
  ['2016','Virgin Money','Business Analyst'],
  ['2017','Commerzbank','Agile Business Analyst'],
  ['2018','Deutsche Bank','Product Owner, AVP'],
  ['2021','Global Relay','Technical Product Manager'],
  ['2022','Tesco','Senior Product Manager'],
  ['2023','Liberis','Principal Product Manager'],
  ['2024','MNM Consulting','Principal Consultant · AI ed-tech'],
];
const NX=i=>300+i*560, LY=678;
const world=$('#world');
nodes.forEach((n,i)=>{
  const g=document.createElement('div');g.className='node';
  g.innerHTML=`
   <div class="abs ring" style="left:${NX(i)-18}px;top:${LY-16}px;width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);background:var(--ink)"></div>
   <div class="abs core" style="left:${NX(i)-9}px;top:${LY-7}px;width:18px;height:18px;border-radius:50%;background:var(--signal)"></div>
   <div class="abs stem" style="left:${NX(i)-1}px;top:${LY-150}px;width:2px;height:130px;background:rgba(242,238,229,.35);transform-origin:50% 100%"></div>
   <div class="mask mono" style="left:${NX(i)+18}px;top:${LY-160}px;font-size:24px;color:var(--signal)"><span class="type" data-text="${n[0]}"></span></div>
   <div class="mask" style="left:${NX(i)+10}px;top:${LY-128}px;height:84px;padding:0 10px"><span class="split" style="font-size:66px;line-height:84px;font-weight:700;letter-spacing:-.035em;display:block">${n[1]}</span></div>
   <div class="mask" style="left:${NX(i)+12}px;top:${LY+40}px;height:44px;padding:0 10px"><span class="split serif" style="font-size:38px;line-height:44px;display:block;color:var(--mute)">${n[2]}</span></div>`;
  world.appendChild(g);
});
$$('.split',world).forEach(el=>{const txt=el.textContent;el.textContent='';[...txt].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;el.appendChild(s)})});
$$('.type',world).forEach(el=>el.textContent='');
const nodeEls=$$('.node');
$('#yearcol').innerHTML=nodes.map(n=>`<div>${n[0]}</div>`).join('');
$('#tickerin').textContent=('Product strategy · Roadmapping · Data as a product · Agile at scale · Discovery · APIs · GDPR · SAFe PO · Stakeholder craft · ').repeat(4);

/* ---------- grain ---------- */
const gctx=$('#grain').getContext('2d');
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const gimg=gctx.createImageData(512,512);
for(let i=0;i<gimg.data.length;i+=4){const v=rnd()*255;gimg.data[i]=gimg.data[i+1]=gimg.data[i+2]=v;gimg.data[i+3]=255}
gctx.putImageData(gimg,0,0);
const grain=$('#grain');grain.style.width='2320px';grain.style.height='1480px';grain.style.imageRendering='pixelated';

/* ================= RENDER ================= */
// timeline cue points
const T={s2:2.95,s3:5.55,s4:9.45,s5:12.55};
function render(t){
  const frame=Math.round(t*60);

  /* grain + grid drift */
  grain.style.transform=`translate(${((frame*137)%200)-100}px,${((frame*71)%200)-100}px)`;
  $('#grid').style.backgroundPosition=`${-t*12}px ${-t*6}px`;
  $('#grid').style.opacity=E.outCubic(P(t,.1,1.2))*(1-P(t,12.6,12.9));

  /* ---- Scene 1 ---- */
  const s1on=t<T.s2+.2; show($('#s1'),s1on);
  if(s1on){
    const dot=$('#dot');
    const ds=E.outBack(P(t,.05,.45));
    const stretch=E.inOutExpo(P(t,.5,1.15));
    dot.style.transform=`scale(${ds*(1-stretch*.2)})`;
    dot.style.opacity=1-P(t,.6,.8);
    const ln=$('#s1line');
    const outL=E.inExpo(P(t,2.45,2.85));
    ln.style.transform=`translateX(${outL*1800}px) scaleX(${Math.max(stretch,.0001)*(1-outL*.6)})`;
    ln.style.opacity=stretch>0?1:0;
    rise($('#s1top'),t,.95,{dir:1,stagger:.04,out:2.4,outDir:1});
    rise($('#s1bot'),t,1.1,{dir:-1,stagger:.04,out:2.45,outDir:-1});
    typeIn($('#s1lab1 .type'),P(t,1.5,2.05)*(1-P(t,2.45,2.7))+(t>2.7?0:0));
    typeIn($('#s1lab2 .type'),P(t,1.7,2.1)*(1-P(t,2.5,2.7)));
    // camera push
    $('#s1').style.transform=`scale(${1.06-0.06*E.outCubic(P(t,.8,3))})`;
    $('#s1').style.transformOrigin='50% 50%';
  }

  /* ---- Scene 2 ---- */
  const s2on=t>T.s2-.05&&t<T.s3+.4; show($('#s2'),s2on);
  if(s2on){
    const masks=$$('#s2 > .mask');
    rise(masks[0],t,T.s2,{stagger:.03,out:5.15,outDir:-1});
    rise(masks[2],t,T.s2+.18,{stagger:.02,out:5.22,outDir:-1,outStagger:.012});
    // slot roll
    const steps=[3.35,3.72,4.09,4.46];
    let idx=0,vel=0;
    steps.forEach(s=>{const x=P(t,s,s+.34);idx+=E.inOutExpo(x);vel+=Math.sin(Math.PI*x)});
    const slotIn=E.outExpo(P(t,T.s2+.08,T.s2+.8));
    const slotOut=E.inExpo(P(t,5.18,5.55));
    $('#slotcol').style.transform=`translateY(${-idx*190+(1-slotIn)*190-slotOut*190}px)`;
    $('#slotcol').style.filter=`blur(${vel*5}px)`;
    $('#slotline').style.transform=`scaleX(${E.inOutExpo(P(t,4.75,5.05))*(1-E.inExpo(P(t,5.15,5.4)))})`;
    $('#s2').style.transform=`translateX(${-E.inOutCubic(P(t,T.s2,5.6))*40}px)`;
  }

  /* ---- Scene 3 ---- */
  const s3on=t>T.s3-.05&&t<T.s4+.3; show(s3,s3on);
  if(s3on){
    const D=.94;
    statEls.forEach((el,i)=>{
      const st=T.s3+.12+i*D, en=st+D;
      const on=t>st-.05&&t<en+.05; show(el,on); if(!on)return;
      const s=stats[i];
      const cnt=E.outExpo(P(t,st,st+.75));
      const num=el.querySelector('.num');
      const v=Math.round(s.val*cnt);
      num.innerHTML=`<span style="color:var(--signal)">${s.pre}</span>${v}<span style="color:var(--signal)">${s.suf}</span>`;
      const inY=(1-E.outExpo(P(t,st,st+.45)))*100, outY=E.inExpo(P(t,en-.22,en))*-100;
      const fit=Math.min(1,880/num.scrollWidth);
      num.style.transformOrigin='0 100%';
      num.style.transform=`translateY(${inY+outY}%) scale(${fit}) skewX(${-(1-E.outExpo(P(t,st,st+.5)))*10}deg)`;
      el.querySelector('.barfill').style.transform=`scaleX(${E.inOutExpo(P(t,st+.1,st+.7))*(i===3?1:s.val/100)})`;
      el.querySelector('.bartrack').style.transform=`scaleX(${1-E.inExpo(P(t,en-.25,en))})`;
      el.querySelector('.bartrack').style.transformOrigin='100% 50%';
      const sp=$$('.split',el);
      rise(sp[0].parentElement,t,st+.06,{stagger:.012,dur:.55,out:en-.24,outDir:-1,outStagger:.004,outDur:.2});
      rise(sp[1].parentElement,t,st+.12,{stagger:.012,dur:.55,out:en-.22,outDir:-1,outStagger:.004,outDur:.2});
      const ty=$$('.type',el);
      typeIn(ty[0],P(t,st,st+.3)*(1-P(t,en-.2,en-.05)));
      typeIn(ty[1],P(t,st+.25,st+.6)*(1-P(t,en-.2,en-.05)));
    });
  }
  // wipe into scene 3 (signal panel sweeps)
  // (rendered via flood element when not used for scene 5)

  /* ---- Scene 4 ---- */
  const s4on=t>T.s4-.05&&t<T.s5+.6; show($('#s4'),s4on);
  if(s4on){
    const draw=E.inOutExpo(P(t,T.s4,T.s4+.6));
    $('#tline').style.transform=`scaleX(${draw})`;
    const pan=E.inOutCubic(P(t,T.s4+.15,T.s5-.05));
    const endX=NX(6)-960;
    const x=-pan*endX;
    world.style.transform=`translateX(${x}px)`;
    // progress line follows a "playhead" at screen x=1060
    const head=cl(1060-x,0,NX(6));
    $('#tprog').style.transform=`scaleX(${(head/4400)*draw})`;
    let yi=0;
    nodeEls.forEach((g,i)=>{
      const sx=NX(i)+x;
      // activation time: when the playhead crosses the node
      const act=(i===0)?T.s4+.35:null;
      const gate=P(t,T.s4+.15,T.s4+.6);
      const a=i===0?P(t,T.s4+.3,T.s4+.75):Math.min(cl((1060-sx)/260),gate*(1+.6*(i===1)));
      const ae=E.outExpo(a);
      g.querySelector('.ring').style.transform=`scale(${E.outBack(cl(a*1.6))})`;
      g.querySelector('.core').style.transform=`scale(${E.outBack(cl(a*1.6-.3))})`;
      g.querySelector('.stem').style.transform=`scaleY(${E.outExpo(cl(a*1.4-.1))})`;
      $$('.split',g).forEach((sp,k)=>{
        $$('.ch',sp).forEach((c,j)=>{const xx=E.outExpo(cl(a*1.5-k*.15-j*.02));c.style.transform=`translateY(${(1-xx)*105}%)`});
      });
      typeIn($('.type',g),cl(a*2));
      if(i>0)yi+=E.inOutExpo(cl(a*1.5));
    });
    $('#yearcol').style.transform=`translateY(${-yi*330}px)`;
    $('#ghostyear').style.opacity=E.outCubic(P(t,T.s4+.2,T.s4+.8));
    $('#tickerin').style.transform=`translateX(${-(t-T.s4)*180}px)`;
    $('#ticker').style.opacity=E.outCubic(P(t,T.s4+.3,T.s4+.9));
  }

  /* ---- Flood: signal panel wipe into s3, then circle into s5 ---- */
  const fl=$('#flood');
  if(t>T.s3-.4&&t<T.s3+.45){
    const a=E.inOutExpo(P(t,T.s3-.35,T.s3+.05)), b=E.inOutExpo(P(t,T.s3+.0,T.s3+.42));
    fl.style.display='';fl.style.borderRadius='0';fl.style.width=W+'px';fl.style.height=H+'px';
    fl.style.left='0';fl.style.top='0';
    fl.style.clipPath=`inset(0 ${100-a*100}% 0 ${b*100}%)`;
    fl.style.transform='none';
  } else if(t>T.s5-.15){
    fl.style.display='';fl.style.clipPath='none';fl.style.borderRadius='50%';
    fl.style.width='40px';fl.style.height='40px';
    fl.style.left=(960-20)+'px';fl.style.top=(LY-20+2)+'px';
    const g=E.inOutExpo(P(t,T.s5,T.s5+.6));
    fl.style.transform=`scale(${.45+g*120})`;
  } else fl.style.display='none';

  /* ---- Scene 5 ---- */
  const s5on=t>T.s5+.3; show($('#s5'),s5on);
  if(s5on){
    const b=T.s5+.35;
    $('#s5line').style.transform=`scaleX(${E.inOutExpo(P(t,b,b+.6))})`;
    const ms=$$('#s5 > .mask');
    rise(ms[0],t,b+.15,{stagger:.04});
    rise(ms[1],t,b+.3,{stagger:.04,dir:-1});
    typeIn($('.type',ms[2]),P(t,b+.6,b+1.1));
    typeIn($('.type',ms[3]),P(t,b+.75,b+1.15));
    $$('#s5foot .type').forEach((e,i)=>typeIn(e,P(t,b+.8+i*.1,b+1.2+i*.1)));
    $('#s5foot').style.borderTopColor=`rgba(11,12,16,${E.outCubic(P(t,b+.8,b+1.3))})`;
    $('#s5').style.transform=`scale(${1.04-.04*E.outCubic(P(t,T.s5+.3,DUR))})`;
  }

  $('#vignette').style.opacity=1-.7*P(t,T.s5,T.s5+.5);

  /* ---- Chrome ---- */
  const ch=$('#chrome');
  ch.style.opacity=E.outCubic(P(t,.6,1.4))*(1-P(t,T.s5+.1,T.s5+.4));
  const sec=E.inOutExpo(P(t,T.s2,T.s2+.4))+E.inOutExpo(P(t,T.s3,T.s3+.4))+E.inOutExpo(P(t,T.s4,T.s4+.4));
  $('#sectcol').style.transform=`translateY(${-sec*28}px)`;
  const ss=Math.floor(t), ff=Math.floor((t%1)*60);
  $('#tc').textContent=`00:00:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
  $('#bar').style.transform=`scaleX(${t/DUR})`;

  /* global fade in/out */
  $('#stage').style.opacity=1;
}
window.render=render;
window.DUR=DUR;
// preview mode: play in real time when opened in a browser
if(!location.search.includes('render')){
  let t0=null;const loop=ts=>{if(t0===null)t0=ts;render(((ts-t0)/1000)%(DUR+1));requestAnimationFrame(loop)};
  document.fonts.ready.then(()=>requestAnimationFrame(loop));
}
</script>
</body>
</html>
